name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install Metal Toolchain
      # Xcode 16 no longer bundles the Metal Toolchain by default. Blompie links
      # the compiled mlx-swift / mlx-swift-lm packages, so install the component
      # (non-fatal) to keep the build green if a Metal shader gets compiled.
      run: xcodebuild -downloadComponent MetalToolchain || true

    - name: Build & Test
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        if [ -z "$XCODEPROJ" ]; then echo "No Xcode project found"; exit 1; fi
        SCHEME="Blompie"
        echo "Testing scheme: $SCHEME"
        set -o pipefail
        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -80
